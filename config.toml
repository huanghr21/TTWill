runs_dir = "runs"

[agent]
# 开发默认值；每个工具调用计一步，无工具回复也计一步。
max_steps = 12
# 每条用户消息最多进行的协调决策轮数，每轮至多分派一批任务。
max_rounds = 8

[backend]
operation_ttl_seconds = 900

[llm]
timeout_seconds = 30.0
max_retries = 2
retry_delay_seconds = 0.5

[models.flash]
model = "fake-demo"
# 仅用于假模型演示，不能作为真实服务的价格。
input_cost_per_million = 0.0
output_cost_per_million = 0.0
cached_input_cost_per_million = 0.0
