runs_dir = "runs"

[agent]
# 开发默认值；每个工具调用计一步，无工具回复也计一步。
max_steps = 12
# 每条用户消息最多进行的协调决策轮数，每轮至多分派一批任务。
max_rounds = 8

[context]
# 计入消息与工具定义的 JSON 字符数，不是模型 token 数。
max_chars = 64000
recent_turns = 4
summary_tier = "flash"

[backend]
operation_ttl_seconds = 900

[llm]
timeout_seconds = 30.0
max_retries = 2
retry_delay_seconds = 0.5

[models.flash]
model = "deepseek-flash"
base_url = "https://api.deepseek.com"
api_key_env = "TTWILL_API_KEY"
# 官方按高峰 / 低峰时段计费，暂不写静态单价；保存用量，费用记为未知。
# https://api-docs.deepseek.com/quick_start/pricing/

[models.flash.parameters]
# 固定官方默认思考强度，三个评测角色共用此档位。
reasoning_effort = "high"
